spring.application.name=digital-wallet

# Username and password live in config/local.properties, which git ignores.
spring.config.import=file:./config/local.properties
spring.datasource.url=jdbc:postgresql://localhost:5432/digital_wallet
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.port=8080

jwt.expiration-ms=86400000
